name: Terraform ECS Deployment

on:
  push:
    branches:
      - main
      - submission/sazimtandabuzo
    paths:
      - '**'  # Watch all files for changes
  workflow_dispatch:
    inputs:
      cleanup:
        description: 'Clean up all resources (use with caution!)'
        required: false
        default: 'false'
        type: boolean

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: ds-devops-app
  ECR_REGISTRY: 810772959397.dkr.ecr.us-east-1.amazonaws.com
  CONTAINER_NAME: minio
  TERRAFORM_VERSION: 1.5.0
  TERRAFORM_WORKING_DIR: ./terraform

jobs:
  validate-terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: ${{ env.TERRAFORM_VERSION }}
        terraform_wrapper: false
    
    - name: Terraform Format
      id: fmt
      run: |
        cd ${{ env.TERRAFORM_WORKING_DIR }}
        terraform fmt -check -recursive
    
    - name: Terraform Init
      id: init
      run: |
        cd ${{ env.TERRAFORM_WORKING_DIR }}
        terraform init -backend=false
    
    - name: Terraform Validate
      id: validate
      run: |
        cd ${{ env.TERRAFORM_WORKING_DIR }}
        terraform validate -no-color

  test-terraform-plan:
    name: Test Terraform Plan
    needs: validate-terraform
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: ${{ env.TERRAFORM_VERSION }}
    
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Debug AWS Configuration
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}
      run: |
        echo "AWS_ACCESS_KEY_ID: ${#AWS_ACCESS_KEY_ID}"
        echo "AWS_REGION: $AWS_REGION"
        aws sts get-caller-identity
        echo "Exit code: $?"

    - name: Terraform Plan
      id: plan
      run: |
        cd ${{ env.TERRAFORM_WORKING_DIR }}
        
        # Initialize Terraform first
        echo "=== Initializing Terraform ==="
        terraform init
        
        # Show current state (non-blocking)
        echo -e "\n=== Current Terraform State ==="
        terraform state list || echo "No state yet, this is expected for a new environment"
        
        # Run plan
        echo -e "\n=== Running Terraform Plan ==="
        terraform plan -input=false -no-color \
          -var="region=${{ env.AWS_REGION }}" \
          -var="environment=production" \
          -var="app_name=${{ env.ECR_REPOSITORY }}" \
          -var="app_port=5000" \
          -var="app_count=2" \
          -var="minio_access_key=minioadmin" \
          -var="minio_secret_key=minioadmin" \
          -var="image_tag=latest" \
          -out=plan.tfplan
    - name: Upload Terraform Plan
      uses: actions/upload-artifact@v4
      with:
        name: tfplan
        path: ${{ env.TERRAFORM_WORKING_DIR }}/plan.tfplan
        if-no-files-found: error

  import-resources:
    name: Import Existing Resources
    needs: validate-terraform
    runs-on: ubuntu-latest
    outputs:
      # These outputs will be set by the actual steps in the job
      resources_imported: ${{ steps.init.outputs.resources_imported || 'false' }}
      vpc_id: ${{ steps.init.outputs.vpc_id || '' }}
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0  # Ensure full history for versioning
      
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: ${{ env.TERRAFORM_VERSION }}
        terraform_wrapper: false
        
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        role-duration-seconds: 3600
        
    - name: Initialize Terraform
      id: init
      run: |
        cd ${{ env.TERRAFORM_WORKING_DIR }}
        terraform init -upgrade -input=false
        
    - name: Check and Import VPC
      id: vpc-import
      continue-on-error: true
      run: |
        cd ${{ env.TERRAFORM_WORKING_DIR }}
        
        # Check if VPC is already in state
        if terraform state show 'aws_vpc.main[0]' >/dev/null 2>&1; then
          echo "VPC already exists in state"
          echo "vpc_id=$(terraform state show 'aws_vpc.main[0]' | grep '^id ' | awk '{print $3}' | tr -d '\"\n')" >> $GITHUB_OUTPUT
          exit 0
        fi
        
        # Find VPC by tags
        VPC_ID=$(aws ec2 describe-vpcs \
          --filters "Name=tag:Name,Values=${{ env.ECR_REPOSITORY }}-vpc" \
          --query 'Vpcs[0].VpcId' \
          --output text 2>/dev/null || echo "")
        
        if [ -n "$VPC_ID" ] && [ "$VPC_ID" != "None" ]; then
          echo "Importing VPC: $VPC_ID"
          terraform import 'aws_vpc.main[0]' "$VPC_ID"
          echo "vpc_id=$VPC_ID" >> $GITHUB_OUTPUT
        else
          echo "No existing VPC found to import"
          echo "vpc_id=" >> $GITHUB_OUTPUT
        fi
    
    - name: Import Subnets
      id: subnets-import
      continue-on-error: true
      run: |
        cd ${{ env.TERRAFORM_WORKING_DIR }}
        
        # Get VPC ID from previous step or find it
        VPC_ID="${{ steps.vpc-import.outputs.vpc_id }}"
        if [ -z "$VPC_ID" ]; then
          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=tag:Name,Values=${{ env.ECR_REPOSITORY }}-vpc" \
            --query 'Vpcs[0].VpcId' \
            --output text 2>/dev/null || echo "")
        fi
        
        if [ -z "$VPC_ID" ] || [ "$VPC_ID" = "None" ]; then
          echo "No VPC found, skipping subnet imports"
          exit 0
        fi
        
        # Import public subnets
        for AZ in a b; do
          SUBNET_ID=$(aws ec2 describe-subnets \
            --filters "Name=tag:Name,Values=${{ env.ECR_REPOSITORY }}-public-$AZ" "Name=vpc-id,Values=$VPC_ID" \
            --query 'Subnets[0].SubnetId' \
            --output text 2>/dev/null || echo "")
            
          if [ -n "$SUBNET_ID" ] && [ "$SUBNET_ID" != "None" ]; then
            INDEX=$([ "$AZ" = "a" ] && echo 0 || echo 1)
            echo "Importing subnet $SUBNET_ID at index $INDEX"
            terraform import "aws_subnet.public[$INDEX]" "$SUBNET_ID" || \
              echo "Failed to import subnet $SUBNET_ID, continuing..."
          fi
        done
    
    # ============================================
    # Security Groups and Network ACLs
    # ============================================
    - name: Import Security Groups and Network ACLs
      id: security-import
      continue-on-error: true
      if: steps.vpc-import.outcome == 'success' && steps.subnets-import.outcome == 'success'
      run: |
        cd ${{ env.TERRAFORM_WORKING_DIR }}
        
        # Get VPC ID
        VPC_ID="${{ steps.vpc-import.outputs.vpc_id }}"
        if [ -z "$VPC_ID" ] || [ "$VPC_ID" = "None" ]; then
          echo "No VPC found, skipping security group imports"
          exit 0
        fi
        
        # Define security groups to import with their expected names
        declare -A SGS=(
          ["alb"]="${{ env.ECR_REPOSITORY }}-alb-sg"
          ["ecs_instances"]="${{ env.ECR_REPOSITORY }}-ecs-instances-sg"
          ["ecs_tasks"]="${{ env.ECR_REPOSITORY }}-ecs-tasks-sg"
          ["rds"]="${{ env.ECR_REPOSITORY }}-rds-sg"
          ["redis"]="${{ env.ECR_REPOSITORY }}-redis-sg"
          ["elasticache"]="${{ env.ECR_REPOSITORY }}-elasticache-sg"
        )
        
        # Import all security groups
        for SG_VAR in "${!SGS[@]}"; do
          SG_NAME="${SGS[$SG_VAR]}"
          
          # Check if already imported
          if terraform state show "aws_security_group.$SG_VAR" >/dev/null 2>&1; then
            echo "Security group $SG_VAR already imported, skipping"
            continue
          fi
          
          # Check if security group exists in AWS
          SG_INFO=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=$SG_NAME" "Name=vpc-id,Values=$VPC_ID" \
            --query 'SecurityGroups[0].[GroupId,GroupName]' \
            --output text 2>/dev/null || echo "")
            
          if [ -n "$SG_INFO" ] && [ "$SG_INFO" != "None" ]; then
            SG_ID=$(echo "$SG_INFO" | awk '{print $1}')
            
            # Check if already in state with a different resource name
            CURRENT_SG=$(terraform state list | grep "^aws_security_group\." | xargs -I{} terraform state show {} | grep -E '^id\s+=' | grep "$SG_ID" || true)
            
            if [ -n "$CURRENT_SG" ]; then
              echo "⚠️ Security group $SG_NAME ($SG_ID) is already managed by Terraform with a different resource name"
              echo "   $CURRENT_SG"
              echo "   Skipping import as it's already managed"
            elif terraform state show "aws_security_group.$SG_VAR" >/dev/null 2>&1; then
              echo "✅ Security group $SG_NAME is already in state"
            else
              echo "Importing security group $SG_NAME ($SG_ID)"
              if ! terraform import "aws_security_group.$SG_VAR" "$SG_ID" 2>/tmp/import_error; then
                if grep -q "already managed by Terraform" /tmp/import_error; then
                  echo "⚠️ Security group $SG_NAME is already managed by Terraform"
                  echo "   This usually means the security group is already managed by another resource"
                  echo "   or was previously imported with a different name."
                else
                  cat /tmp/import_error
                  echo "❌ Failed to import security group $SG_NAME"
                fi
                rm -f /tmp/import_error
              fi
            fi
          else
            echo "ℹ️ Security group $SG_NAME not found, it will be created"
          fi
        done
        
        # Import Network ACLs
        NACLS=$(aws ec2 describe-network-acls \
          --filters "Name=vpc-id,Values=$VPC_ID" \
          --query 'NetworkAcls[*].[NetworkAclId,Tags[?Key==`Name`].Value|[0]]' \
          --output text 2>/dev/null || echo "")
          
        if [ -n "$NACLS" ]; then
          echo "$NACLS" | while read -r NACL_ID NACL_NAME; do
            if [[ "$NACL_NAME" == *"public"* ]]; then
              if ! terraform state show 'aws_network_acl.public' >/dev/null 2>&1; then
                echo "Importing public network ACL $NACL_ID"
                terraform import 'aws_network_acl.public' "$NACL_ID" || \
                  echo "Failed to import public network ACL, continuing..."
              fi
            elif [[ "$NACL_NAME" == *"private"* ]]; then
              if ! terraform state show 'aws_network_acl.private' >/dev/null 2>&1; then
                echo "Importing private network ACL $NACL_ID"
                terraform import 'aws_network_acl.private' "$NACL_ID" || \
                  echo "Failed to import private network ACL, continuing..."
              fi
            fi
          done
        fi
        
        # Import VPC Endpoints if they exist
        VPC_ENDPOINTS=$(aws ec2 describe-vpc-endpoints \
          --filters "Name=vpc-id,Values=$VPC_ID" \
          --query 'VpcEndpoints[*].[VpcEndpointId,ServiceName]' \
          --output text 2>/dev/null || echo "")
          
        if [ -n "$VPC_ENDPOINTS" ]; then
          echo "$VPC_ENDPOINTS" | while read -r ENDPOINT_ID SERVICE_NAME; do
            if [[ "$SERVICE_NAME" == *"s3"* ]]; then
              if ! terraform state show 'aws_vpc_endpoint.s3' >/dev/null 2>&1; then
                echo "Importing S3 VPC Endpoint $ENDPOINT_ID"
                terraform import 'aws_vpc_endpoint.s3' "$ENDPOINT_ID" || \
                  echo "Failed to import S3 VPC Endpoint, continuing..."
              fi
            elif [[ "$SERVICE_NAME" == *"ecr.api"* ]]; then
              if ! terraform state show 'aws_vpc_endpoint.ecr_api' >/dev/null 2>&1; then
                echo "Importing ECR API VPC Endpoint $ENDPOINT_ID"
                terraform import 'aws_vpc_endpoint.ecr_api' "$ENDPOINT_ID" || \
                  echo "Failed to import ECR API VPC Endpoint, continuing..."
              fi
            elif [[ "$SERVICE_NAME" == *"ecr.dkr"* ]]; then
              if ! terraform state show 'aws_vpc_endpoint.ecr_dkr' >/dev/null 2>&1; then
                echo "Importing ECR DKR VPC Endpoint $ENDPOINT_ID"
                terraform import 'aws_vpc_endpoint.ecr_dkr' "$ENDPOINT_ID" || \
                  echo "Failed to import ECR DKR VPC Endpoint, continuing..."
              fi
            fi
          done
        fi
    
    # ============================================
    # ECR Repository
    # ============================================
    - name: Import ECR Repository and Related Resources
      id: ecr-import
      continue-on-error: true
      if: steps.security-import.outcome == 'success' || steps.security-import.outcome == 'skipped'
      run: |
        cd ${{ env.TERRAFORM_WORKING_DIR }}
        
        # Check if already imported
        if terraform state show 'aws_ecr_repository.app' >/dev/null 2>&1; then
          echo "ECR repository already imported"
          exit 0
        fi
        
        # Import ECR Repository
        if aws ecr describe-repositories --repository-names ${{ env.ECR_REPOSITORY }} >/dev/null 2>&1; then
          echo "Importing ECR repository: ${{ env.ECR_REPOSITORY }}"
          terraform import aws_ecr_repository.app ${{ env.ECR_REPOSITORY }} || \
            echo "Failed to import ECR repository, continuing..."
          
          # Import ECR Lifecycle Policy if it exists
          if aws ecr get-lifecycle-policy --repository-name ${{ env.ECR_REPOSITORY }} >/dev/null 2>&1; then
            echo "Importing ECR Lifecycle Policy"
            terraform import 'aws_ecr_lifecycle_policy.app' "${{ env.ECR_REPOSITORY }}" || \
              echo "Failed to import ECR Lifecycle Policy, continuing..."
          fi
          
          # Import ECR Repository Policy if it exists
          if aws ecr get-repository-policy --repository-name ${{ env.ECR_REPOSITORY }} >/dev/null 2>&1; then
            echo "Importing ECR Repository Policy"
            terraform import 'aws_ecr_repository_policy.app' "${{ env.ECR_REPOSITORY }}" || \
              echo "Failed to import ECR Repository Policy, continuing..."
          fi
        else
          echo "ECR repository ${{ env.ECR_REPOSITORY }} not found, will be created"
        fi
        
        # Import ECR Pull Through Cache Rule if it exists
        if aws ecr describe-pull-through-cache-rules --repository-name-prefix ${{ env.ECR_REPOSITORY }} --query 'pullThroughCacheRules[0].ecrRepositoryPrefix' --output text 2>/dev/null | grep -q ${{ env.ECR_REPOSITORY }}; then
          echo "Importing ECR Pull Through Cache Rule"
          terraform import 'aws_ecr_pull_through_cache_rule.app' "${{ env.ECR_REPOSITORY }}" || \
            echo "Failed to import ECR Pull Through Cache Rule, continuing..."
        fi
    
    # ============================================
    # S3 Bucket and Related Resources
    # ============================================
    - name: Import S3 Bucket and Related Resources
      id: s3-import
      continue-on-error: true
      if: steps.ecr-import.outcome == 'success' || steps.ecr-import.outcome == 'skipped'
      run: |
        cd ${{ env.TERRAFORM_WORKING_DIR }}
        
        # Check if already imported
        if terraform state show 'aws_s3_bucket.analytics_data' >/dev/null 2>&1; then
          echo "S3 bucket already imported"
          exit 0
        fi
        
        ACCOUNT_ID="${{ steps.account-id.outputs.account_id }}"
        BUCKET_NAME="${{ env.ECR_REPOSITORY }}-analytics-data-$ACCOUNT_ID"
        
        if aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
          echo "Importing S3 bucket: $BUCKET_NAME"
          terraform import aws_s3_bucket.analytics_data "$BUCKET_NAME" || \
            echo "Failed to import S3 bucket, continuing..."
          
          # Import S3 Bucket Policy if it exists
          if aws s3api get-bucket-policy --bucket "$BUCKET_NAME" >/dev/null 2>&1; then
            echo "Importing S3 Bucket Policy"
            terraform import 'aws_s3_bucket_policy.analytics_data' "$BUCKET_NAME" || \
              echo "Failed to import S3 Bucket Policy, continuing..."
          fi
          
          # Import S3 Bucket Public Access Block if it exists
          PUBLIC_ACCESS_CONFIG=$(aws s3api get-public-access-block --bucket "$BUCKET_NAME" 2>/dev/null || echo "")
          if [ -n "$PUBLIC_ACCESS_CONFIG" ]; then
            echo "Importing S3 Bucket Public Access Block"
            terraform import 'aws_s3_bucket_public_access_block.analytics_data' "$BUCKET_NAME" || \
              echo "Failed to import S3 Bucket Public Access Block, continuing..."
          fi
          
          # Import S3 Bucket Versioning if enabled
          VERSIONING_STATUS=$(aws s3api get-bucket-versioning --bucket "$BUCKET_NAME" --query 'Status' --output text 2>/dev/null || echo "")
          if [ -n "$VERSIONING_STATUS" ]; then
            echo "Importing S3 Bucket Versioning"
            terraform import 'aws_s3_bucket_versioning.analytics_data' "$BUCKET_NAME" || \
              echo "Failed to import S3 Bucket Versioning, continuing..."
          fi
          
          # Import S3 Bucket Server Side Encryption if configured
          ENCRYPTION_STATUS=$(aws s3api get-bucket-encryption --bucket "$BUCKET_NAME" 2>/dev/null || echo "")
          if [ -n "$ENCRYPTION_STATUS" ]; then
            echo "Importing S3 Bucket Server Side Encryption"
            terraform import 'aws_s3_bucket_server_side_encryption_configuration.analytics_data' "$BUCKET_NAME" || \
              echo "Failed to import S3 Bucket Server Side Encryption, continuing..."
          fi
          
          # Import S3 Bucket Lifecycle Configuration if it exists
          LIFECYCLE_STATUS=$(aws s3api get-bucket-lifecycle-configuration --bucket "$BUCKET_NAME" 2>/dev/null || echo "")
          if [ -n "$LIFECYCLE_STATUS" ]; then
            echo "Importing S3 Bucket Lifecycle Configuration"
            terraform import 'aws_s3_bucket_lifecycle_configuration.analytics_data' "$BUCKET_NAME" || \
              echo "Failed to import S3 Bucket Lifecycle Configuration, continuing..."
          fi
        else
          echo "S3 bucket $BUCKET_NAME not found, will be created"
        fi
    
    # ============================================
    # Service Discovery and Related Resources
    # ============================================
    - name: Import Service Discovery and Related Resources
      id: service-discovery-import
      continue-on-error: true
      if: steps.s3-import.outcome == 'success' || steps.s3-import.outcome == 'skipped'
      run: |
        cd ${{ env.TERRAFORM_WORKING_DIR }}
        
        # Check if already imported
        if terraform state show 'aws_service_discovery_private_dns_namespace.private' >/dev/null 2>&1; then
          echo "Service Discovery namespace already imported"
          exit 0
        fi
        
        # Get VPC ID if needed
        VPC_ID="${{ steps.vpc-import.outputs.vpc_id }}"
        if [ -z "$VPC_ID" ] || [ "$VPC_ID" = "None" ]; then
          echo "No VPC found, skipping Service Discovery imports"
          exit 0
        fi
        
        # Import Service Discovery Private DNS Namespace
        NAMESPACE_ID=$(aws servicediscovery list-namespaces \
          --filters "Name=NAME,Values=${{ env.ECR_REPOSITORY }}.local" "Name=TYPE,Values=DNS_PRIVATE" \
          --query 'Namespaces[0].Id' \
          --output text 2>/dev/null || echo "")
        
        if [ -n "$NAMESPACE_ID" ] && [ "$NAMESPACE_ID" != "None" ] && [ -n "$VPC_ID" ] && [ "$VPC_ID" != "None" ]; then
          echo "Importing Service Discovery Namespace: $NAMESPACE_ID with VPC: $VPC_ID"
          # Format: NAMESPACE_ID:VPC_ID
          terraform import aws_service_discovery_private_dns_namespace.private "${NAMESPACE_ID}:${VPC_ID}" || \
            echo "Failed to import Service Discovery namespace, continuing..."
          
          # Import Service Discovery Services
          SERVICES=$(aws servicediscovery list-services \
            --filters "Name=NAMESPACE_ID,Values=$NAMESPACE_ID" \
            --query 'Services[*].[Id,Name]' \
            --output text 2>/dev/null || echo "")
            
          if [ -n "$SERVICES" ]; then
            echo "$SERVICES" | while read -r SERVICE_ID SERVICE_NAME; do
              if [ -n "$SERVICE_ID" ] && [ "$SERVICE_ID" != "None" ]; then
                # Map service name to Terraform resource name
                case $SERVICE_NAME in
                  *-service)
                    TF_RESOURCE_NAME="${SERVICE_NAME%-service}"
                    ;;
                  *)
                    TF_RESOURCE_NAME="$SERVICE_NAME"
                    ;;
                esac
                
                echo "Importing Service Discovery Service: $SERVICE_NAME ($SERVICE_ID)"
                terraform import "aws_service_discovery_service.$TF_RESOURCE_NAME" "$SERVICE_ID" || \
                  echo "Failed to import Service Discovery Service $SERVICE_NAME, continuing..."
              fi
            done
          fi
          
          # Import Route 53 Private Hosted Zone if it exists
          HOSTED_ZONE_ID=$(aws route53 list-hosted-zones-by-name \
            --dns-name "${{ env.ECR_REPOSITORY }}.local" \
            --query 'HostedZones[?Config.PrivateZone==`true`].Id' \
            --output text 2>/dev/null | head -n1 || echo "")
            
          if [ -n "$HOSTED_ZONE_ID" ] && [ "$HOSTED_ZONE_ID" != "None" ]; then
            echo "Importing Route 53 Private Hosted Zone: $HOSTED_ZONE_ID"
            terraform import 'aws_route53_zone.private' "${HOSTED_ZONE_ID#/hostedzone/}" || \
              echo "Failed to import Route 53 Private Hosted Zone, continuing..."
              
            # Import Route 53 Records if they exist
            RECORDS=$(aws route53 list-resource-record-sets \
              --hosted-zone-id "${HOSTED_ZONE_ID#/hostedzone/}" \
              --query 'ResourceRecordSets[?Type==`A` || Type==`CNAME` || Type==`SRV`]' \
              --output json 2>/dev/null || echo '[]')
              
            if [ "$RECORDS" != "[]" ]; then
              echo "$RECORDS" | jq -c '.[]' | while read -r RECORD; do
                RECORD_NAME=$(echo "$RECORD" | jq -r '.Name' | sed 's/\.$//')
                RECORD_TYPE=$(echo "$RECORD" | jq -r '.Type')
                
                # Skip NS and SOA records as they are managed by AWS
                if [ "$RECORD_TYPE" = "NS" ] || [ "$RECORD_TYPE" = "SOA" ]; then
                  continue
                fi
                
                # Create a unique identifier for the record
                RECORD_IDENTIFIER="${RECORD_NAME}_${RECORD_TYPE}"
                
                echo "Importing Route 53 Record: $RECORD_NAME ($RECORD_TYPE)"
                terraform import "aws_route53_record.${RECORD_IDENTIFIER}" "${HOSTED_ZONE_ID#/hostedzone/}_${RECORD_NAME}_${RECORD_TYPE}" || \
                  echo "Failed to import Route 53 Record $RECORD_NAME, continuing..."
              done
            fi
          fi
        else
          echo "Service Discovery namespace not found, will be created"
        fi
    
    - name: Verify and Plan
      id: verify
      run: |
        cd ${{ env.TERRAFORM_WORKING_DIR }}
        
        # Show current state
        echo "=== Current Terraform State ==="
        terraform state list
        
        # Run plan to verify configuration
        echo -e "\n=== Running Terraform Plan ==="
        terraform plan -input=false -no-color \
          -var="region=${{ env.AWS_REGION }}" \
          -var="environment=production" \
          -var="app_name=${{ env.ECR_REPOSITORY }}" \
          -var="app_port=5000" \
          -var="app_count=2" \
          -var="minio_access_key=minioadmin" \
          -var="minio_secret_key=minioadmin" \
          -var="image_tag=latest" \
          -out=tfplan
        
        # Check if there are any changes needed
        if terraform show -no-color tfplan | grep -q 'No changes.'; then
          echo "No changes needed, infrastructure is up-to-date"
          echo "changes_needed=false" >> $GITHUB_OUTPUT
        else
          echo "Changes detected, please apply the plan"
          echo "changes_needed=true" >> $GITHUB_OUTPUT
        fi
    
    - name: Set Import Status
      id: set-import-status
      run: |
        # This step just sets the output for the job
        echo "resources_imported=true" >> $GITHUB_OUTPUT
        
    - name: Import Load Balancer if it exists
      continue-on-error: true
      run: |
        cd ${{ env.TERRAFORM_WORKING_DIR }}
        # Skip ALB import here as it's handled in the Import All Remaining Resources section
        
    - name: Import VPC if it exists
      continue-on-error: true
      run: |
        cd ${{ env.TERRAFORM_WORKING_DIR }}
        VPC_ID=$(aws ec2 describe-vpcs --filters "Name=tag:Name,Values=${{ env.ECR_REPOSITORY }}-vpc" --query 'Vpcs[0].VpcId' --output text 2>/dev/null || echo "")
        if [ ! -z "$VPC_ID" ] && [ "$VPC_ID" != "None" ]; then
          echo "Importing existing VPC"
          terraform import aws_vpc.main "$VPC_ID"
        fi
        
    - name: Import S3 Bucket if it exists
      continue-on-error: true
      run: |
        cd ${{ env.TERRAFORM_WORKING_DIR }}
        BUCKET_NAME="${{ env.ECR_REPOSITORY }}-analytics-data-$(aws sts get-caller-identity --query Account --output text)"
        if aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
          echo "Importing existing S3 Bucket"
          terraform import aws_s3_bucket.analytics_data "$BUCKET_NAME"
          
          # Import S3 bucket policy if it exists
          if aws s3api get-bucket-policy --bucket "$BUCKET_NAME" > /dev/null 2>&1; then
            echo "Importing S3 Bucket Policy"
            terraform import aws_s3_bucket_policy.analytics_data "$BUCKET_NAME"
          fi
        fi
        
    - name: Import Security Groups if they exist
      continue-on-error: true
      run: |
        cd ${{ env.TERRAFORM_WORKING_DIR }}
        
        # Get VPC ID if not already set
        if [ -z "$VPC_ID" ]; then
          VPC_ID=$(aws ec2 describe-vpcs --filters "Name=tag:Name,Values=${{ env.ECR_REPOSITORY }}-vpc" --query 'Vpcs[0].VpcId' --output text 2>/dev/null || echo "")
        fi
        
        if [ ! -z "$VPC_ID" ] && [ "$VPC_ID" != "None" ]; then
          # Import ALB Security Group
          ALB_SG_ID=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=${{ env.ECR_REPOSITORY }}-alb-sg" "Name=vpc-id,Values=$VPC_ID" \
            --query 'SecurityGroups[0].GroupId' --output text 2>/dev/null || echo "")
            
          if [ ! -z "$ALB_SG_ID" ] && [ "$ALB_SG_ID" != "None" ]; then
            echo "Importing ALB Security Group"
            if ! terraform state show "aws_security_group.alb" > /dev/null 2>&1; then
              terraform import aws_security_group.alb $ALB_SG_ID || \
              echo "ALB Security Group already exists in state or import failed, continuing..."
            else
              echo "ALB Security Group already exists in state"
            fi
          fi
          
          # Import ECS Instances Security Group
          ECS_SG_ID=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=${{ env.ECR_REPOSITORY }}-ecs-instances-sg" "Name=vpc-id,Values=$VPC_ID" \
            --query 'SecurityGroups[0].GroupId' --output text 2>/dev/null || echo "")
            
          if [ ! -z "$ECS_SG_ID" ] && [ "$ECS_SG_ID" != "None" ]; then
            echo "Importing ECS Instances Security Group"
            if ! terraform state show "aws_security_group.ecs_instances" > /dev/null 2>&1; then
              terraform import aws_security_group.ecs_instances $ECS_SG_ID || \
              echo "ECS Instances Security Group already exists in state or import failed, continuing..."
            else
              echo "ECS Instances Security Group already exists in state"
            fi
          fi
          
          # Import ECS Service Security Group if it exists
          ECS_SERVICE_SG_ID=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=${{ env.ECR_REPOSITORY }}-ecs-service-sg" "Name=vpc-id,Values=$VPC_ID" \
            --query 'SecurityGroups[0].GroupId' --output text 2>/dev/null || echo "")
            
          if [ ! -z "$ECS_SERVICE_SG_ID" ] && [ "$ECS_SERVICE_SG_ID" != "None" ]; then
            echo "Importing ECS Service Security Group"
            if ! terraform state show "aws_security_group.ecs_service" > /dev/null 2>&1; then
              terraform import aws_security_group.ecs_service $ECS_SERVICE_SG_ID || \
              echo "ECS Service Security Group already exists in state or import failed, continuing..."
            else
              echo "ECS Service Security Group already exists in state"
            fi
          fi
        fi
        
    - name: Import All Remaining Resources
      continue-on-error: true
      run: |
        cd ${{ env.TERRAFORM_WORKING_DIR }}
        
        # 1. IAM Resources
        echo "=== Importing IAM Resources ==="
        
        # IAM Policy for S3 Access
        POLICY_NAME="${{ env.ECR_REPOSITORY }}-analytics-bucket-access"
        ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
        POLICY_ARN="arn:aws:iam::${ACCOUNT_ID}:policy/${POLICY_NAME}"
        
        if aws iam get-policy --policy-arn "$POLICY_ARN" > /dev/null 2>&1; then
          echo "Importing IAM Policy: $POLICY_ARN"
          terraform import "aws_iam_policy.analytics_bucket_access" "$POLICY_ARN" || \
            echo "IAM Policy import failed or already exists, continuing..."
        else
          echo "IAM Policy $POLICY_NAME not found, it will be created"
        fi
        
        # IAM Roles
        for ROLE_NAME in \
          "${{ env.ECR_REPOSITORY }}-ecs-task-execution-role" \
          "${{ env.ECR_REPOSITORY }}-ecs-task-role" \
          "${{ env.ECR_REPOSITORY }}-ecs-instance-role"; do
          if aws iam get-role --role-name "$ROLE_NAME" > /dev/null 2>&1; then
            echo "Importing IAM Role: $ROLE_NAME"
            terraform import "aws_iam_role.${ROLE_NAME//-/_}" "$ROLE_NAME" || \
              echo "Failed to import IAM Role $ROLE_NAME, continuing..."
          fi
        done
        
        # 2. ECS Resources
        echo "\n=== Importing ECS Resources ==="
        
        # ECS Cluster - Skip import here as it's handled in the Import All Remaining Resources section
        
        # ECS Task Definitions
        for TASK_DEF in "app" "minio"; do
          TASK_ARN=$(aws ecs list-task-definitions --family-prefix "${{ env.ECR_REPOSITORY }}-$TASK_DEF" --query 'taskDefinitionArns[0]' --output text 2>/dev/null || echo "")
          if [ ! -z "$TASK_ARN" ] && [ "$TASK_ARN" != "None" ]; then
            echo "Importing ECS Task Definition: $TASK_ARN"
            terraform import "aws_ecs_task_definition.$TASK_DEF" "$TASK_ARN" || \
              echo "Failed to import ECS Task Definition $TASK_DEF, continuing..."
          fi
        done
        
        # 3. EC2 & Auto Scaling
        echo "\n=== Importing EC2 & Auto Scaling Resources ==="
        
        # Launch Template
        LAUNCH_TEMPLATE_NAME=$(aws ec2 describe-launch-templates \
          --filters "Name=tag:Name,Values=${{ env.ECR_REPOSITORY }}-launch-template-*" \
          --query 'LaunchTemplates[0].LaunchTemplateName' --output text 2>/dev/null || echo "")
        if [ ! -z "$LAUNCH_TEMPLATE_NAME" ] && [ "$LAUNCH_TEMPLATE_NAME" != "None" ]; then
          echo "Importing Launch Template: $LAUNCH_TEMPLATE_NAME"
          terraform import "aws_launch_template.ecs_launch_template[0]" "$LAUNCH_TEMPLATE_NAME" || \
            echo "Launch Template import failed or already exists, continuing..."
        fi
        
        # Auto Scaling Group
        ASG_NAME=$(aws autoscaling describe-auto-scaling-groups \
          --query "AutoScalingGroups[?contains(Tags[?Key=='Name'].Value, '${{ env.ECR_REPOSITORY }}-asg')].AutoScalingGroupName" \
          --output text 2>/dev/null | head -n1 || echo "")
        if [ ! -z "$ASG_NAME" ] && [ "$ASG_NAME" != "None" ]; then
          echo "Importing Auto Scaling Group: $ASG_NAME"
          terraform import "aws_autoscaling_group.ecs_asg[0]" "$ASG_NAME" || \
            echo "Auto Scaling Group import failed or already exists, continuing..."
        fi
        
        # 4. S3 Resources
        echo "\n=== Importing S3 Resources ==="
        BUCKET_NAME="${{ env.ECR_REPOSITORY }}-analytics-data-$(aws sts get-caller-identity --query Account --output text)"
        if aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
          # Check if the bucket is already in the state
          if ! terraform state show 'aws_s3_bucket.analytics_data' >/dev/null 2>&1; then
            echo "Importing S3 Bucket: $BUCKET_NAME"
            if ! terraform import "aws_s3_bucket.analytics_data" "$BUCKET_NAME" 2>/tmp/s3_import_error; then
              if grep -q "already managed by Terraform" /tmp/s3_import_error; then
                echo "⚠️  S3 Bucket is already managed by Terraform"
                echo "   Run 'terraform state list | grep $BUCKET_NAME' to find the existing resource"
                echo "   You may need to update your configuration to reference the existing resource"
              else
                cat /tmp/s3_import_error
                echo "❌ Failed to import S3 Bucket"
              fi
              rm -f /tmp/s3_import_error
            else
              echo "✅ Successfully imported S3 Bucket"
              
              # Only try to import versioning if the bucket import was successful
              echo "Importing S3 Bucket Versioning..."
              terraform import "aws_s3_bucket_versioning.analytics_data_versioning[0]" "$BUCKET_NAME" 2>/dev/null || \
                echo "S3 Bucket Versioning import failed or already exists, continuing..."
                
              echo "Importing S3 Bucket Encryption..."
              terraform import "aws_s3_bucket_server_side_encryption_configuration.analytics_data_encryption[0]" "$BUCKET_NAME" 2>/dev/null || \
                echo "S3 Bucket Encryption import failed or already exists, continuing..."
            fi
          else
            echo "✅ S3 Bucket is already in state"
          fi
        else
          echo "ℹ️  S3 Bucket $BUCKET_NAME not found, it will be created"
        fi
        
        # 5. Load Balancer Resources
        echo "\n=== Importing Load Balancer Resources ==="
        
        # ALB
        ALB_ARN=$(aws elbv2 describe-load-balancers --names "${{ env.ECR_REPOSITORY }}-alb" --query 'LoadBalancers[0].LoadBalancerArn' --output text 2>/dev/null || echo "")
        if [ ! -z "$ALB_ARN" ] && [ "$ALB_ARN" != "None" ]; then
          if ! terraform state show 'aws_lb.main' >/dev/null 2>&1; then
            echo "Importing Application Load Balancer: $ALB_ARN"
            if ! terraform import "aws_lb.main" "$ALB_ARN" 2>/tmp/alb_import_error; then
              if grep -q "already managed by Terraform" /tmp/alb_import_error; then
                echo "⚠️ ALB is already managed by Terraform under a different resource name"
                echo "   Run 'terraform state list | grep $ALB_ARN' to find the existing resource"
              else
                cat /tmp/alb_import_error
                echo "❌ Failed to import ALB"
              fi
              rm -f /tmp/alb_import_error
            fi
          else
            echo "✅ ALB is already in state"
          fi
          
          # ALB Listeners
          LISTENER_ARN=$(aws elbv2 describe-listeners --load-balancer-arn "$ALB_ARN" --query 'Listeners[0].ListenerArn' --output text 2>/dev/null || echo "")
          if [ ! -z "$LISTENER_ARN" ] && [ "$LISTENER_ARN" != "None" ]; then
            echo "Importing ALB Listener..."
            terraform import "aws_lb_listener.http_forward" "$LISTENER_ARN" || \
              echo "ALB Listener import failed or already exists, continuing..."
          fi
        fi
        
        # Target Groups
        for TG_NAME in "${{ env.ECR_REPOSITORY }}-tg" "${{ env.ECR_REPOSITORY }}-minio-tg"; do
          TG_ARN=$(aws elbv2 describe-target-groups --names "$TG_NAME" --query 'TargetGroups[0].TargetGroupArn' --output text 2>/dev/null || echo "")
          if [ ! -z "$TG_ARN" ] && [ "$TG_ARN" != "None" ]; then
            # Determine the correct resource name based on the target group name
            if [[ "$TG_NAME" == *"minio"* ]]; then
              RESOURCE_NAME="minio_tg"
            else
              RESOURCE_NAME="app_tg"
            fi
            
            echo "Importing Target Group: $TG_NAME as $RESOURCE_NAME"
            if terraform state show "aws_lb_target_group.$RESOURCE_NAME" >/dev/null 2>&1; then
              echo "✅ Target Group $TG_NAME is already in state as $RESOURCE_NAME"
            else
              if ! terraform import "aws_lb_target_group.$RESOURCE_NAME" "$TG_ARN" 2>/tmp/tg_import_error; then
                if grep -q "does not exist in the configuration" /tmp/tg_import_error; then
                  echo "⚠️  Target Group $TG_NAME cannot be imported - resource '$RESOURCE_NAME' not found in configuration"
                  echo "    Please make sure you have defined 'aws_lb_target_group.$RESOURCE_NAME' in your Terraform code"
                else
                  cat /tmp/tg_import_error
                  echo "❌ Failed to import Target Group $TG_NAME"
                fi
                rm -f /tmp/tg_import_error
              fi
            fi
          fi
        done
        
        # 6. Service Discovery
        echo "\n=== Importing Service Discovery Resources ==="
        
        # First, check if the resource is already in the state
        if terraform state show 'aws_service_discovery_private_dns_namespace.private' >/dev/null 2>&1; then
          echo "✅ Service Discovery Namespace is already in state"
          NAMESPACE_ID=$(terraform state show 'aws_service_discovery_private_dns_namespace.private' | grep 'id ' | awk '{print $3}' | tr -d '"')
        else
          echo "Looking up existing Service Discovery namespace..."
          
          # Get the namespace ID using AWS CLI
          NAMESPACE_ID=$(aws servicediscovery list-namespaces \
            --query "Namespaces[?Name=='${{ env.ECR_REPOSITORY }}.local' && Type=='DNS_PRIVATE'].Id" \
            --output text 2>/dev/null | head -1 | cut -d'/' -f2 || echo "")
            
          if [ -n "$NAMESPACE_ID" ] && [ "$NAMESPACE_ID" != "None" ]; then
            echo "Found existing Service Discovery Namespace: $NAMESPACE_ID"
            
            # Try importing with just the namespace ID (most reliable method)
            echo "Attempting to import with namespace ID: $NAMESPACE_ID"
            
            if terraform import "aws_service_discovery_private_dns_namespace.private" "$NAMESPACE_ID" 2>/tmp/ns_import_error; then
              echo "✅ Successfully imported Service Discovery Namespace"
            else
              if grep -q "already managed by Terraform" /tmp/ns_import_error; then
                echo "⚠️  Service Discovery Namespace is already managed by Terraform"
                # Get the existing resource name from state
                EXISTING_RESOURCE=$(terraform state list | grep 'aws_service_discovery_private_dns_namespace' | head -1)
                if [ -n "$EXISTING_RESOURCE" ]; then
                  echo "   The namespace is already imported as: $EXISTING_RESOURCE"
                  # Update the namespace ID to the existing one
                  NAMESPACE_ID=$(terraform state show "$EXISTING_RESOURCE" | grep 'id ' | awk '{print $3}' | tr -d '"')
                fi
              else
                cat /tmp/ns_import_error
                echo "❌ Failed to import Service Discovery Namespace"
                echo "   You can try importing it manually with:"
                echo "   terraform import aws_service_discovery_private_dns_namespace.private $NAMESPACE_ID"
              fi
              rm -f /tmp/ns_import_error
            fi
          else
            echo "ℹ️  No existing Service Discovery Namespace found"
          fi
        fi
        
        # If we have a namespace ID, try to import the services
        if [ -n "$NAMESPACE_ID" ] && [ "$NAMESPACE_ID" != "None" ]; then
          echo "\n=== Importing Service Discovery Services ==="
          
          for SERVICE_NAME in "app" "minio"; do
            echo "Checking for $SERVICE_NAME service..."
            SERVICE_ARN=$(aws servicediscovery list-services \
              --filters "Name=NAME,Values=$SERVICE_NAME" "Name=NAMESPACE_ID,Values=$NAMESPACE_ID" \
              --query 'Services[0].Arn' --output text 2>/dev/null || echo "")
              
            if [ -n "$SERVICE_ARN" ] && [ "$SERVICE_ARN" != "None" ]; then
              echo "Importing service: $SERVICE_NAME"
              terraform import "aws_service_discovery_service.$SERVICE_NAME" "$NAMESPACE_ID/$SERVICE_NAME" || \
                echo "⚠️  Failed to import $SERVICE_NAME service (may already be imported)"
            else
              echo "ℹ️  No existing $SERVICE_NAME service found"
            fi
          done
        fi
        
        # Import Services if we have a valid NAMESPACE_ID
        if [ ! -z "$NAMESPACE_ID" ] && [ "$NAMESPACE_ID" != "None" ]; then
          for SERVICE_NAME in "app" "minio"; do
            SERVICE_ARN=$(aws servicediscovery list-services --filters "Name=NAMESPACE_ID,Values=$NAMESPACE_ID" \
              --query "Services[?Name=='$SERVICE_NAME'].Arn" --output text 2>/dev/null || echo "")
            if [ ! -z "$SERVICE_ARN" ] && [ "$SERVICE_ARN" != "None" ]; then
              echo "Importing Service Discovery Service: $SERVICE_NAME"
              terraform import "aws_service_discovery_service.$SERVICE_NAME" "$NAMESPACE_ID/$SERVICE_NAME" || \
                echo "Service Discovery Service $SERVICE_NAME import failed or already exists, continuing..."
            fi
          done
        fi
        
        # 7. CloudWatch Logs
        echo "\n=== Importing CloudWatch Log Groups ==="
        for LOG_GROUP in "/ecs/${{ env.ECR_REPOSITORY }}" "/ecs/${{ env.ECR_REPOSITORY }}-minio"; do
          if aws logs describe-log-groups --log-group-name-prefix "$LOG_GROUP" --query 'logGroups[].logGroupName' --output text | grep -q "$LOG_GROUP"; then
            echo "Importing CloudWatch Log Group: $LOG_GROUP"
            terraform import "aws_cloudwatch_log_group.${LOG_GROUP##*/}" "$LOG_GROUP" || \
              echo "CloudWatch Log Group $LOG_GROUP import failed or already exists, continuing..."
          fi
        done

    - name: Import IAM Roles and Policies if they exist
      continue-on-error: true
      run: |
        cd ${{ env.TERRAFORM_WORKING_DIR }}
        
        # Import ECS Task Execution Role
        TASK_EXEC_ROLE_NAME="${{ env.ECR_REPOSITORY }}-ecs-task-execution-role"
        if aws iam get-role --role-name $TASK_EXEC_ROLE_NAME > /dev/null 2>&1; then
          echo "Importing ECS Task Execution Role"
          if ! terraform state show "aws_iam_role.ecs_task_execution_role" > /dev/null 2>&1; then
            terraform import aws_iam_role.ecs_task_execution_role $TASK_EXEC_ROLE_NAME || \
            echo "Task Execution Role already exists in state or import failed, continuing..."
          else
            echo "Task Execution Role already exists in state"
          fi
          
          # Import policy attachment if not already in state
          if ! terraform state show "aws_iam_role_policy_attachment.ecs_task_execution_role_policy[0]" > /dev/null 2>&1; then
            terraform import "aws_iam_role_policy_attachment.ecs_task_execution_role_policy[0]" \
              "$TASK_EXEC_ROLE_NAME/arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy" || \
              echo "Policy attachment already exists in state or import failed, continuing..."
          fi
        fi
        
        # Import ECS Task Role
        TASK_ROLE_NAME="${{ env.ECR_REPOSITORY }}-ecs-task-role"
        if aws iam get-role --role-name $TASK_ROLE_NAME > /dev/null 2>&1; then
          echo "Importing ECS Task Role"
          if ! terraform state show "aws_iam_role.ecs_task_role" > /dev/null 2>&1; then
            terraform import aws_iam_role.ecs_task_role $TASK_ROLE_NAME || \
            echo "Task Role already exists in state or import failed, continuing..."
          else
            echo "Task Role already exists in state"
          fi
        fi
        
        # Import ECS Instance Role if it exists
        INSTANCE_ROLE_NAME="${{ env.ECR_REPOSITORY }}-ecs-instance-role"
        if aws iam get-role --role-name $INSTANCE_ROLE_NAME > /dev/null 2>&1; then
          echo "Importing ECS Instance Role"
          if ! terraform state show "aws_iam_role.ecs_instance_role" > /dev/null 2>&1; then
            terraform import aws_iam_role.ecs_instance_role $INSTANCE_ROLE_NAME || \
            echo "Instance Role already exists in state or import failed, continuing..."
          else
            echo "Instance Role already exists in state"
          fi
          
          # Import policy attachment if not already in state
          if ! terraform state show "aws_iam_role_policy_attachment.ecs_instance_role[0]" > /dev/null 2>&1; then
            terraform import "aws_iam_role_policy_attachment.ecs_instance_role[0]" \
              "$INSTANCE_ROLE_NAME/arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role" || \
              echo "Instance Role policy attachment already exists in state or import failed, continuing..."
          fi
        fi
        
    - name: Import ECS Cluster and Services if they exist
      continue-on-error: true
      run: |
        cd ${{ env.TERRAFORM_WORKING_DIR }}
        
        # Import ECS Cluster
        CLUSTER_NAME="${{ env.ECR_REPOSITORY }}-cluster"
        if aws ecs describe-clusters --clusters $CLUSTER_NAME --query 'clusters[0].clusterArn' --output text 2>/dev/null | grep -q 'arn:aws:ecs:'; then
          # Check if ECS cluster is already in state
          if ! terraform state show 'aws_ecs_cluster.main' >/dev/null 2>&1; then
            echo "Importing ECS Cluster: $CLUSTER_NAME"
            if ! terraform import aws_ecs_cluster.main $CLUSTER_NAME 2>/tmp/ecs_import_error; then
              if grep -q "already managed by Terraform" /tmp/ecs_import_error; then
                echo "⚠️  ECS Cluster is already managed by Terraform under a different resource name"
                echo "   Run 'terraform state list | grep $CLUSTER_NAME' to find the existing resource"
              else
                cat /tmp/ecs_import_error
                echo "❌ Failed to import ECS Cluster"
              fi
              rm -f /tmp/ecs_import_error
            fi
          else
            echo "✅ ECS Cluster is already in state"
          fi
          
          # Import ECS Services
          SERVICES=$(aws ecs list-services --cluster $CLUSTER_NAME --query 'serviceArns[*]' --output text 2>/dev/null || echo "")
          for SERVICE_ARN in $SERVICES; do
            SERVICE_NAME=$(echo $SERVICE_ARN | awk -F'/' '{print $NF}')
            echo "Importing ECS Service: $SERVICE_NAME"
            terraform import "aws_ecs_service.${SERVICE_NAME//-/_}" "$CLUSTER_NAME/$SERVICE_NAME"
          done
        fi
        
    - name: Import Route53 Private Hosted Zone if it exists
      continue-on-error: true
      run: |
        cd ${{ env.TERRAFORM_WORKING_DIR }}
        
        # Check if VPC ID is available
        if [ -z "$VPC_ID" ]; then
          VPC_ID=$(aws ec2 describe-vpcs --filters "Name=tag:Name,Values=${{ env.ECR_REPOSITORY }}-vpc" --query 'Vpcs[0].VpcId' --output text 2>/dev/null || echo "")
        fi
        
        if [ ! -z "$VPC_ID" ] && [ "$VPC_ID" != "None" ]; then
          # Import Route53 Private Hosted Zone
          ZONE_NAME="${{ env.ECR_REPOSITORY }}.local"
          # Get only the first matching private hosted zone
          ZONE_ID=$(aws route53 list-hosted-zones-by-name \
            --dns-name $ZONE_NAME \
            --query 'HostedZones[?Config.PrivateZone==`true`].Id | [0]' \
            --output text 2>/dev/null | cut -d'/' -f3 || echo "")
          
          if [ ! -z "$ZONE_ID" ] && [ "$ZONE_ID" != "None" ]; then
            # Check if the Route53 zone resource exists in the configuration
            if grep -q 'resource "aws_route53_zone" "private"' *.tf; then
              echo "Importing Route53 Private Hosted Zone: ${ZONE_ID#/hostedzone/}"
              if ! terraform import aws_route53_zone.private "${ZONE_ID#/hostedzone/}" 2>/tmp/route53_import_error; then
                if grep -q "already managed by Terraform" /tmp/route53_import_error; then
                  echo "⚠️  Route53 Zone is already managed by Terraform"
                  echo "   Run 'terraform state list | grep aws_route53_zone' to find the existing resource"
                else
                  cat /tmp/route53_import_error
                  echo "❌ Failed to import Route53 Zone"
                fi
                rm -f /tmp/route53_import_error
              fi
              
              # Import VPC association if it exists in the configuration
              if grep -q 'resource "aws_route53_zone_association" "private_vpc_assoc"' *.tf; then
                ASSOC_ID=$(aws route53 get-hosted-zone --id ${ZONE_ID#/hostedzone/} --query 'VPCs[?VPCId==`'$VPC_ID'`].VPCId' --output text 2>/dev/null || echo "")
                if [ ! -z "$ASSOC_ID" ] && [ "$ASSOC_ID" != "None" ]; then
                  echo "Importing VPC association for Route53 zone"
                  terraform import "aws_route53_zone_association.private_vpc_assoc[0]" "${ZONE_ID#/hostedzone/}_$VPC_ID" || \
                    echo "Failed to import VPC association, continuing..."
                fi
              else
                echo "⚠️  aws_route53_zone_association.private_vpc_assoc not found in configuration"
                echo "   Add the resource to your Terraform configuration to import it"
              fi
            else
              echo "⚠️  aws_route53_zone.private not found in configuration"
              echo "   Add the following to your Terraform configuration to import this resource:"
              echo "   resource \"aws_route53_zone\" \"private\" {"
              echo "     name = \"${{ env.ECR_REPOSITORY }}.local\""
              echo "     vpc {"
              echo "       vpc_id = \"$VPC_ID\""
              echo "     }"
              echo "   }"
            fi
          fi
        fi
        
    - name: Import CloudWatch Log Groups if they exist
      continue-on-error: true
      run: |
        cd ${{ env.TERRAFORM_WORKING_DIR }}
        
        # Import application log group
        LOG_GROUP_NAME="/ecs/${{ env.ECR_REPOSITORY }}"
        if aws logs describe-log-groups --log-group-name-prefix "$LOG_GROUP_NAME" --query 'logGroups[].logGroupName' --output text | grep -q "$LOG_GROUP_NAME"; then
          echo "Importing CloudWatch Log Group: $LOG_GROUP_NAME"
          terraform import "aws_cloudwatch_log_group.app[0]" "$LOG_GROUP_NAME"
        fi
        
        # Import MinIO log group
        MINIO_LOG_GROUP="/ecs/${{ env.ECR_REPOSITORY }}-minio"
        if aws logs describe-log-groups --log-group-name-prefix "$MINIO_LOG_GROUP" --query 'logGroups[].logGroupName' --output text | grep -q "$MINIO_LOG_GROUP"; then
          echo "Importing CloudWatch Log Group: $MINIO_LOG_GROUP"
          terraform import aws_cloudwatch_log_group.minio "$MINIO_LOG_GROUP"
        fi
        
    - name: Show Import Status
      run: |
        cd ${{ env.TERRAFORM_WORKING_DIR }}
        echo "### Imported Resources"
        terraform state list
        
    - name: Import Security Groups if they exist
      continue-on-error: true
      run: |
        cd ${{ env.TERRAFORM_WORKING_DIR }}
        
        # Get VPC ID
        VPC_ID=$(aws ec2 describe-vpcs --filters "Name=tag:Name,Values=${{ env.ECR_REPOSITORY }}-vpc" --query 'Vpcs[0].VpcId' --output text 2>/dev/null || echo "")
        
        if [ ! -z "$VPC_ID" ] && [ "$VPC_ID" != "None" ]; then
          # Import ALB Security Group
          ALB_SG_ID=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=${{ env.ECR_REPOSITORY }}-alb-sg" "Name=vpc-id,Values=$VPC_ID" \
            --query 'SecurityGroups[0].GroupId' --output text 2>/dev/null || echo "")
            
          if [ ! -z "$ALB_SG_ID" ] && [ "$ALB_SG_ID" != "None" ]; then
            echo "Importing ALB Security Group"
            terraform import aws_security_group.alb $ALB_SG_ID
          fi
          
          # Import ECS Instances Security Group
          ECS_SG_ID=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=${{ env.ECR_REPOSITORY }}-ecs-instances-sg" "Name=vpc-id,Values=$VPC_ID" \
            --query 'SecurityGroups[0].GroupId' --output text 2>/dev/null || echo "")
            
          if [ ! -z "$ECS_SG_ID" ] && [ "$ECS_SG_ID" != "None" ]; then
            echo "Importing ECS Instances Security Group"
            terraform import aws_security_group.ecs_instances $ECS_SG_ID
          fi
        fi
        
    - name: Import Service Discovery Namespace if it exists
      continue-on-error: true
      run: |
        cd ${{ env.TERRAFORM_WORKING_DIR }}
        
        # Get the specific namespace for our application
        NAMESPACE_ID=$(aws servicediscovery list-namespaces \
          --query "Namespaces[?Name=='${{ env.ECR_REPOSITORY }}.local' && Type=='DNS_PRIVATE'].Id" \
          --output text 2>/dev/null || echo "")
        
        if [ ! -z "$NAMESPACE_ID" ] && [ "$NAMESPACE_ID" != "None" ]; then
          # Take only the first match if multiple are returned
          NAMESPACE_ID=$(echo "$NAMESPACE_ID" | head -n1 | tr -d '[:space:]')
          echo "Importing Service Discovery Namespace: $NAMESPACE_ID"
          
          # Get the VPC ID for the namespace association
          VPC_ID=$(aws ec2 describe-vpcs --filters "Name=tag:Name,Values=${{ env.ECR_REPOSITORY }}-vpc" --query 'Vpcs[0].VpcId' --output text 2>/dev/null || echo "")
          
          if [ ! -z "$VPC_ID" ] && [ "$VPC_ID" != "None" ]; then
            echo "Importing with VPC association: $VPC_ID"
            terraform import "aws_service_discovery_private_dns_namespace.private" "$NAMESPACE_ID" || \
              echo "Failed to import Service Discovery Namespace, but continuing..."
          else
            terraform import "aws_service_discovery_private_dns_namespace.private" "$NAMESPACE_ID" || \
              echo "Failed to import Service Discovery Namespace (no VPC), but continuing..."
          fi
        else
          echo "No matching Service Discovery Namespace found to import"
        fi
        
    - name: Show Import Status
      id: import-status
      continue-on-error: true
      run: |
        cd ${{ env.TERRAFORM_WORKING_DIR }}
        echo "Checking Terraform state..."
        
        # Use a temporary file to capture output and handle errors
        STATE_LIST=$(mktemp)
        if terraform state list > "$STATE_LIST" 2>&1; then
          echo "Current Terraform state:"
          cat "$STATE_LIST"
          
          # Check if any resources are in the state
          if [ -s "$STATE_LIST" ]; then
            echo "resources_imported=true" >> $GITHUB_OUTPUT
            echo "✅ Resources found in Terraform state"
          else
            echo "resources_imported=false" >> $GITHUB_OUTPUT
            echo "⚠️ No resources found in Terraform state"
          fi
        else
          echo "⚠️ Could not list Terraform state, but continuing anyway"
          echo "resources_imported=true" >> $GITHUB_OUTPUT
        fi
        
        # Clean up
        rm -f "$STATE_LIST"
        
    - name: Verify Resources
      if: steps.import-status.outputs.resources_imported != 'true'
      run: |
        echo "##[error]Failed to import all required resources. Please check the logs above for errors."
        exit 1

  build-and-push-ecr:
    name: Build and Push to ECR
    needs: [validate-terraform, import-resources]  # Depend on both validation and resource import
    if: needs.import-resources.outputs.resources_imported == 'true' || needs.import-resources.outcome == 'skipped'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Create ECR Repository if it doesn't exist
      run: |
        # Check if repository exists
        if ! aws ecr describe-repositories --repository-names ${{ env.ECR_REPOSITORY }} > /dev/null 2>&1; then
          echo "Creating ECR repository: ${{ env.ECR_REPOSITORY }}"
          aws ecr create-repository --repository-name ${{ env.ECR_REPOSITORY }}
        else
          echo "ECR repository already exists: ${{ env.ECR_REPOSITORY }}"
        fi

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver: docker-container
        
    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        build-args: |
          BUILDKIT_INLINE_CACHE=1
        no-cache-filters: true

  deploy-terraform:
    name: Deploy Terraform (Creates ECR Repo & Infrastructure)
    needs: [test-terraform-plan, build-and-push-ecr]
    # Only run if import-resources was successful or skipped
    if: needs.import-resources.outcome == 'success' || needs.import-resources.outcome == 'skipped'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Download Terraform Plan
      uses: actions/download-artifact@v4
      with:
        name: tfplan
        path: ${{ env.TERRAFORM_WORKING_DIR }}
    
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: ${{ env.TERRAFORM_VERSION }}
    
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Import Existing Resources (if any)
      run: |
        cd ${{ env.TERRAFORM_WORKING_DIR }}
        
        # Initialize Terraform
        terraform init -upgrade
        
        # Function to import resource if it exists
        import_resource() {
          local resource_type=$1
          local resource_name=$2
          local resource_id=$3
          
          if [ -z "$resource_id" ]; then
            echo "No $resource_type ID provided, skipping import"
            return 0
          fi
          
          echo "Attempting to import $resource_type: $resource_id"
          terraform import -auto-approve "$resource_type.$resource_name" "$resource_id" 2>/dev/null || \
            echo "Failed to import $resource_type $resource_id, will create if needed"
        }
        
        # Get AWS account ID
        ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
        
        # Import ECR repository if it exists
        ECR_REPO=$(aws ecr describe-repositories --repository-names ${{ env.ECR_REPOSITORY }} --query 'repositories[0].repositoryArn' --output text 2>/dev/null || true)
        import_resource "aws_ecr_repository.app" "app" "${ECR_REPO##*/}"
        
        # Import IAM roles if they exist - check both naming patterns
        for role_suffix in "ecs-task-execution-role" "ecs-task-role" "ecs-instance-role"; do
          # Try both naming patterns
          for prefix in "ds-devops-app" "${{ env.ECR_REPOSITORY }}"; do
            role_name="${prefix}-${role_suffix}"
            ROLE_ARN=$(aws iam get-role --role-name "$role_name" --query 'Role.Arn' --output text 2>/dev/null || true)
            
            if [ ! -z "$ROLE_ARN" ]; then
              echo "Found IAM role: $role_name"
              
              # Determine the Terraform resource name based on the role suffix
              case $role_suffix in
                "ecs-task-execution-role")
                  TF_RESOURCE_NAME="ecs_task_execution_role"
                  ;;
                "ecs-task-role")
                  TF_RESOURCE_NAME="ecs_task_role"
                  ;;
                "ecs-instance-role")
                  TF_RESOURCE_NAME="ecs_instance_role"
                  ;;
                *)
                  TF_RESOURCE_NAME=$(echo "$role_suffix" | tr '-' '_')
                  ;;
              esac
              
              # Import the role
              import_resource "aws_iam_role.$TF_RESOURCE_NAME" "$TF_RESOURCE_NAME" "$role_name"
              
              # Import role policy attachments
              echo "Importing policies for role: $role_name"
              POLICIES=$(aws iam list-attached-role-policies --role-name "$role_name" --query 'AttachedPolicies[].PolicyArn' --output text 2>/dev/null || true)
              for policy_arn in $POLICIES; do
                POLICY_NAME=$(echo "$policy_arn" | awk -F'/' '{print $2}' | tr '-' '_')
                echo "Importing policy attachment: $TF_RESOURCE_NAME -> $policy_arn"
                import_resource "aws_iam_role_policy_attachment.${TF_RESOURCE_NAME}_${POLICY_NAME}" \
                  "${TF_RESOURCE_NAME}_${POLICY_NAME}" \
                  "$role_name/$policy_arn" || true
              done
              
              # Break after finding the first matching role name pattern
              break
            fi
          done
        done
        
        # Import IAM policy if it exists
        POLICY_ARN="arn:aws:iam::${ACCOUNT_ID}:policy/ds-devops-app-s3-access"
        if aws iam get-policy --policy-arn "$POLICY_ARN" >/dev/null 2>&1; then
          import_resource "aws_iam_policy.s3_access" "s3_access" "$POLICY_ARN"
        fi
        
        # Import ECS cluster if it exists (using the correct resource name)
        ECS_CLUSTER=$(aws ecs describe-clusters --clusters "${{ env.ECR_REPOSITORY }}-cluster" --query 'clusters[0].clusterArn' --output text 2>/dev/null || echo "")
        if [ "$ECS_CLUSTER" != "None" ] && [ ! -z "$ECS_CLUSTER" ]; then
          # This is handled in the main import section, so we'll skip it here
          echo "ECS Cluster import is handled in the main import section"
        fi
    
    - name: Terraform Initialize
      run: |
        cd ${{ env.TERRAFORM_WORKING_DIR }}
        terraform init -upgrade
        
    - name: Import Service Discovery Namespace if it exists
      continue-on-error: true
      run: |
        cd ${{ env.TERRAFORM_WORKING_DIR }}
        # Get VPC ID
        VPC_ID=$(aws ec2 describe-vpcs --filters "Name=tag:Name,Values=${{ env.ECR_REPOSITORY }}-vpc" --query 'Vpcs[0].VpcId' --output text 2>/dev/null || echo "")
        if [ ! -z "$VPC_ID" ] && [ "$VPC_ID" != "None" ]; then
          # Check if service discovery namespace exists
          NAMESPACE_ID=$(aws servicediscovery list-namespaces --filters "Name=NAME,Values=${{ env.ECR_REPOSITORY }}.local" --query 'Namespaces[?Type=="DNS_PRIVATE"].Id' --output text 2>/dev/null || echo "")
          if [ ! -z "$NAMESPACE_ID" ] && [ "$NAMESPACE_ID" != "None" ]; then
            echo "Importing existing Service Discovery Namespace"
            terraform import aws_service_discovery_private_dns_namespace.private "${NAMESPACE_ID}"
          fi
        fi
    
    - name: Terraform Apply
      run: |
        cd ${{ env.TERRAFORM_WORKING_DIR }}
        
        # First, import any remaining resources that might have been missed
        echo "Importing any remaining resources..."
        
        # Import ECR Repository if it exists
        if aws ecr describe-repositories --repository-names ${{ env.ECR_REPOSITORY }} > /dev/null 2>&1; then
          echo "Importing ECR repository..."
          terraform import aws_ecr_repository.app ${{ env.ECR_REPOSITORY }} || echo "ECR repository import failed or already exists"
        fi
        
        # Import EC2 Key Pair if it exists
        if aws ec2 describe-key-pairs --key-names "${{ env.ECR_REPOSITORY }}-ec2-key" > /dev/null 2>&1; then
          echo "Importing EC2 Key Pair..."
          terraform import aws_key_pair.ec2_key_pair "${{ env.ECR_REPOSITORY }}-ec2-key" || echo "EC2 Key Pair import failed or already exists"
        fi
        
        # Import Security Groups
        VPC_ID=$(aws ec2 describe-vpcs --filters "Name=tag:Name,Values=${{ env.ECR_REPOSITORY }}-vpc" --query 'Vpcs[0].VpcId' --output text 2>/dev/null || echo "")
        if [ ! -z "$VPC_ID" ] && [ "$VPC_ID" != "None" ]; then
          # Import ALB Security Group
          ALB_SG_ID=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=${{ env.ECR_REPOSITORY }}-alb-sg" "Name=vpc-id,Values=$VPC_ID" \
            --query 'SecurityGroups[0].GroupId' --output text 2>/dev/null || echo "")
          if [ ! -z "$ALB_SG_ID" ] && [ "$ALB_SG_ID" != "None" ]; then
            echo "Importing ALB Security Group..."
            terraform import aws_security_group.alb $ALB_SG_ID || echo "ALB Security Group import failed or already exists"
          fi
          
          # Import ECS Instances Security Group
          ECS_SG_ID=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=${{ env.ECR_REPOSITORY }}-ecs-instances-sg" "Name=vpc-id,Values=$VPC_ID" \
            --query 'SecurityGroups[0].GroupId' --output text 2>/dev/null || echo "")
          if [ ! -z "$ECS_SG_ID" ] && [ "$ECS_SG_ID" != "None" ]; then
            echo "Importing ECS Instances Security Group..."
            terraform import aws_security_group.ecs_instances $ECS_SG_ID || echo "ECS Instances Security Group import failed or already exists"
          fi
        fi
        
        # Import S3 Bucket if it exists
        BUCKET_NAME="${{ env.ECR_REPOSITORY }}-analytics-data-$(aws sts get-caller-identity --query Account --output text)"
        if aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
          echo "Importing S3 Bucket..."
          terraform import aws_s3_bucket.analytics_data "$BUCKET_NAME" || echo "S3 Bucket import failed or already exists"
        fi
        
        # First, check if Service Discovery Namespace is already in the state
        if ! terraform state show "aws_service_discovery_private_dns_namespace.private" > /dev/null 2>&1; then
          # Import Service Discovery Namespace if it exists - handle multiple namespaces
          NAMESPACE_IDS=$(aws servicediscovery list-namespaces \
            --query "Namespaces[?Name=='${{ env.ECR_REPOSITORY }}.local' && Type=='DNS_PRIVATE'].Id" \
            --output text 2>/dev/null || echo "")
            
          if [ ! -z "$NAMESPACE_IDS" ] && [ "$NAMESPACE_IDS" != "None" ]; then
            # Take only the first matching namespace
            NAMESPACE_ID=$(echo "$NAMESPACE_IDS" | head -n1 | tr -d '[:space:]')
            echo "Importing Service Discovery Namespace: $NAMESPACE_ID"
            
            # Get the VPC ID for the namespace association
            VPC_ID=$(aws ec2 describe-vpcs --filters "Name=tag:Name,Values=${{ env.ECR_REPOSITORY }}-vpc" --query 'Vpcs[0].VpcId' --output text 2>/dev/null || echo "")
            
            # Import the namespace
            if terraform import "aws_service_discovery_private_dns_namespace.private" "$NAMESPACE_ID" 2>&1 | grep -q "Error: Cannot import non-existent remote object"; then
              echo "Namespace doesn't exist in AWS, it will be created during apply"
            elif [ $? -ne 0 ]; then
              echo "Failed to import Service Discovery Namespace, but continuing..."
              
              # If import failed due to existing hosted zone, try to find and import it
              HOSTED_ZONE_ID=$(aws route53 list-hosted-zones-by-name --dns-name "${{ env.ECR_REPOSITORY }}.local" --query 'HostedZones[?Config.PrivateZone==`true`].Id' --output text 2>/dev/null || echo "")
              if [ ! -z "$HOSTED_ZONE_ID" ] && [ "$HOSTED_ZONE_ID" != "None" ]; then
                echo "Found existing Route53 Private Hosted Zone: $HOSTED_ZONE_ID"
                echo "You may need to manually clean up the existing hosted zone if it's causing conflicts."
                echo "Continuing with the deployment..."
              fi
            fi
          fi
        else
          echo "Service Discovery Namespace already exists in state"
        fi
        
        echo "Running terraform apply with direct variables..."
        # Always use direct apply to avoid stale plan issues
        terraform apply -auto-approve \
          -var="region=${{ env.AWS_REGION }}" \
          -var="environment=production" \
          -var="app_name=${{ env.ECR_REPOSITORY }}" \
          -var="app_port=5000" \
          -var="app_count=2" \
          -var="minio_access_key=minioadmin" \
          -var="minio_secret_key=minioadmin" \
          -var="image_tag=latest"

  test-deployment:
    name: Test Deployment
    needs: deploy-terraform
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/submission/sazimtandabuzo'
    runs-on: ubuntu-latest
    
    outputs:
      alb_dns: ${{ steps.alb.outputs.ALB_DNS }}
    
    steps:
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Get ALB DNS
      id: alb
      run: |
        ALB_DNS=$(aws elbv2 describe-load-balancers \
          --names ds-devops-app-alb \
          --query 'LoadBalancers[0].DNSName' \
          --output text)
        echo "ALB_DNS=$ALB_DNS" >> $GITHUB_OUTPUT
    
    - name: Run Smoke Tests
      run: |
        # Wait for services to be ready
        sleep 30
        
        # Test MinIO Console (should return 200)
        curl -I http://${{ steps.alb.outputs.ALB_DNS }}:9001
        
        # Test MinIO API (should return XML with ListAllMyBucketsResult)
        curl -s http://${{ steps.alb.outputs.ALB_DNS }}:9000

  cleanup-resources:
    name: Cleanup Resources
    needs: [deploy-terraform, test-deployment]
    if: ${{ github.event_name == 'workflow_dispatch' || failure() }}
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: ${{ env.TERRAFORM_VERSION }}
        
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: List existing resources (for debugging)
      run: |
        echo "Listing existing ECS clusters:"
        aws ecs list-clusters || echo "No ECS clusters found or error listing clusters"
        
        echo "\nListing existing ECR repositories:"
        aws ecr describe-repositories || echo "No ECR repositories found or error listing repositories"
        
        echo "\nListing existing ALBs:"
        aws elbv2 describe-load-balancers || echo "No ALBs found or error listing ALBs"
    
    - name: Force Cleanup Resources
      run: |
        # Set AWS region
        export AWS_PAGER=""
        export AWS_REGION=${{ env.AWS_REGION }}
        
        # Delete ECS Service if it exists
        echo "Deleting ECS Service if it exists..."
        aws ecs update-service \
          --cluster ${{ env.ECR_REPOSITORY }} \
          --service ${{ env.ECR_REPOSITORY }} \
          --desired-count 0 \
          --region ${{ env.AWS_REGION }} || true
          
        aws ecs delete-service \
          --cluster ${{ env.ECR_REPOSITORY }} \
          --service ${{ env.ECR_REPOSITORY }} \
          --region ${{ env.AWS_REGION }} || true
        
        # Delete ECR Repository
        echo "Deleting ECR Repository..."
        aws ecr delete-repository \
          --repository-name ${{ env.ECR_REPOSITORY }} \
          --force \
          --region ${{ env.AWS_REGION }} || true
        
        # Delete CloudWatch Log Group
        echo "Deleting CloudWatch Log Group..."
        aws logs delete-log-group \
          --log-group-name "/ecs/${{ env.ECR_REPOSITORY }}" \
          --region ${{ env.AWS_REGION }} || true
        
        # Delete IAM Roles and Policies
        for role in "ds-devops-app-ecs-task-execution-role" "ds-devops-app-ecs-task-role" "ds-devops-app-ecs-instance-role"; do
          echo "Processing IAM Role: $role"
          
          # Check if role exists
          if ! aws iam get-role --role-name "$role" --region "${{ env.AWS_REGION }}" >/dev/null 2>&1; then
            echo "Role $role does not exist, skipping..."
            continue
          fi
          
          # For ECS instance role, handle instance profiles
          if [[ "$role" == *"instance-role"* ]]; then
            echo "Processing instance profile for role: $role"
            # List all instance profiles that might be using this role
            INSTANCE_PROFILES=$(aws iam list-instance-profiles-for-role --role-name "$role" --query "InstanceProfiles[*].InstanceProfileName" --output text --region "${{ env.AWS_REGION }}" 2>/dev/null || true)
            
            for profile in $INSTANCE_PROFILES; do
              echo "Removing role from instance profile: $profile"
              # Remove the role from the instance profile
              aws iam remove-role-from-instance-profile \
                --instance-profile-name "$profile" \
                --role-name "$role" \
                --region "${{ env.AWS_REGION }}" || true
                
              # Delete the instance profile if it's no longer needed
              echo "Deleting instance profile: $profile"
              aws iam delete-instance-profile \
                --instance-profile-name "$profile" \
                --region "${{ env.AWS_REGION }}" || true
            done
          fi
          
          # Detach all managed policies
          echo "Detaching policies from IAM Role: $role"
          for policy_arn in $(aws iam list-attached-role-policies --role-name "$role" --query "AttachedPolicies[].PolicyArn" --output text --region "${{ env.AWS_REGION }}" 2>/dev/null || true); do
            echo "Detaching policy: $policy_arn"
            aws iam detach-role-policy \
              --role-name "$role" \
              --policy-arn "$policy_arn" \
              --region "${{ env.AWS_REGION }}" || true
          done
          
          # Delete inline policies
          echo "Deleting inline policies for role: $role"
          for policy_name in $(aws iam list-role-policies --role-name "$role" --query "PolicyNames" --output text --region "${{ env.AWS_REGION }}" 2>/dev/null || true); do
            echo "Deleting inline policy: $policy_name"
            aws iam delete-role-policy \
              --role-name "$role" \
              --policy-name "$policy_name" \
              --region "${{ env.AWS_REGION }}" || true
          done
          
          # Finally, delete the role
          echo "Deleting IAM Role: $role"
          aws iam delete-role \
            --role-name "$role" \
            --region "${{ env.AWS_REGION }}" || echo "Failed to delete role $role, continuing..."
        done
        
        # Delete IAM Policy
        echo "Deleting IAM Policy..."
        aws iam delete-policy \
          --policy-arn "arn:aws:iam::$(aws sts get-caller-identity --query Account --output text):policy/ds-devops-app-s3-access" \
          --region ${{ env.AWS_REGION }} || true
        
        # Run Terraform destroy as a final cleanup
        echo "Running Terraform destroy..."
        cd ${{ env.TERRAFORM_WORKING_DIR }}
        terraform init -input=false
        terraform destroy -auto-approve \
          -var="region=${{ env.AWS_REGION }}" \
          -var="environment=production" \
          -var="app_name=${{ env.ECR_REPOSITORY }}" \
          -var="app_port=5000" \
          -var="minio_access_key=minioadmin" \
          -var="minio_secret_key=minioadmin" \
          -var="image_tag=latest"

  # Store successful deployment information for rollback
  store-version:
    name: Store Version
    needs: [deploy-terraform, test-deployment]
    if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    
    steps:
    - name: Store current version
      run: |
        # In a real scenario, you might want to store this in AWS SSM Parameter Store
        # or another persistent storage
        echo "Current deployment version: ${{ env.DEPLOYMENT_TIMESTAMP }}"
        echo "Previous version was: ${{ env.PREVIOUS_VERSION }}"
        # Here you would update your tracking mechanism (e.g., AWS SSM Parameter Store)
        # aws ssm put-parameter \
        #   --name "/${{ env.ECR_REPOSITORY }}/current_version" \
        #   --value "${{ env.DEPLOYMENT_TIMESTAMP }}" \
        #   --type String --overwrite
        # aws ssm put-parameter \
        #   --name "/${{ env.ECR_REPOSITORY }}/previous_version" \
        #   --value "${{ env.PREVIOUS_VERSION }}" \
        #   --type String --overwrite

  rollback:
    name: Rollback
    needs: [deploy-terraform]
    # Only run on push failures or when manually triggered with rollback=true
    if: >
      (failure() && github.event_name == 'push') || 
      (github.event_name == 'workflow_dispatch' && github.event.inputs.rollback == 'true')
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: ${{ env.TERRAFORM_VERSION }}
    
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Rollback to previous version
      run: |
        cd ${{ env.TERRAFORM_WORKING_DIR }}
        
        # In a real scenario, you would fetch the previous version from your tracking system
        # PREVIOUS_VERSION=$(aws ssm get-parameter --name "/$ECR_REPOSITORY/previous_version" --query "Parameter.Value" --output text || echo "")
        # CURRENT_VERSION=$(aws ssm get-parameter --name "/$ECR_REPOSITORY/current_version" --query "Parameter.Value" --output text || echo "")
        
        # For this example, we'll use the input parameter or environment variable
        PREVIOUS_VERSION="${{ github.event.inputs.previous_version || env.PREVIOUS_VERSION }}"
        
        if [ "$PREVIOUS_VERSION" == "none" ] || [ -z "$PREVIOUS_VERSION" ]; then
          echo "No previous version found for rollback"
          exit 1
        fi
        
        echo "Rolling back to version: $PREVIOUS_VERSION"
        
        # Update the task definition to use the previous version
        terraform init
        terraform apply -auto-approve \
          -var="region=${{ env.AWS_REGION }}" \
          -var="environment=production" \
          -var="app_name=${{ env.ECR_REPOSITORY }}" \
          -var="app_port=5000" \
          -var="app_count=2" \
          -var="minio_access_key=minioadmin" \
          -var="minio_secret_key=minioadmin" \
          -var="image_tag=$PREVIOUS_VERSION"
        
        echo "Rollback to version $PREVIOUS_VERSION completed"

  notify:
    name: Notify
    needs: [deploy-terraform, test-deployment, cleanup-resources, store-version, rollback]
    if: always()
    runs-on: ubuntu-latest
    
    steps:
    - name: Print deployment status
      if: always()
      run: |
        echo "Deployment completed with status: ${{ needs.deploy-terraform.result || 'unknown' }}"
        echo "Test status: ${{ needs.test-deployment.result || 'skipped' }}"
        echo "Rollback status: ${{ needs.rollback.result || 'not_attempted' }}"
        echo "Workflow URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        echo "Test status: ${{ needs.test-deployment.result || 'skipped' }}"
        echo "Workflow URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
